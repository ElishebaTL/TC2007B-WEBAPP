<ion-header>
  <ion-toolbar>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section class="page-header">
    <div>
      <h1>Notificaciones</h1>
      <p>{{ unreadCount }} nuevas notificaciones</p>
    </div>

    <span class="bell">🔔</span>
  </section>

  <ion-button expand="block" fill="outline" (click)="markAllAsRead()">
    ✓ Marcar todas como leídas
  </ion-button>

  <ion-card *ngFor="let notification of notifications" (click)="markAsRead(notification)"
  [class.read-card]="notification.read">
    <ion-card-content class="notification-card">
      <div class="icon" [class]="notification.type">
        {{ notification.type === 'warning' ? '⚠️' : notification.type === 'message' ? '💬' : '✅' }}
      </div>

      <div class="notification-info">
        <h2>{{ notification.title }}</h2>
        <p>{{ notification.message }}</p>
        <small>{{ notification.date }}</small>
      </div>

      <span class="status" *ngIf="!notification.read"></span>
    </ion-card-content>
  </ion-card>
</ion-content>
